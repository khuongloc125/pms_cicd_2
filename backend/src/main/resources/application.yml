spring:
  application:
    name: backend
  server:
    port: 8080
  web:
    resources:
      static-locations: file:uploads/
    cors:
      allowed-origins: 
        - http://localhost:3000
        - https://quanliduan-pms.site
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Authorization,userId,Content-Type,role
      allow-credentials: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  # MySQL
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL  # In-memory DB, mimic MySQL mode để tương thích query
    driver-class-name: org.h2.Driver
    username: root
    password: 12345
  jpa:
    hibernate:
      ddl-auto: create-drop  # Tạo schema mới mỗi test, drop sau để clean
    show-sql: true  # Giữ để debug nếu cần
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Tắt debug mode toàn cục
  debug: false

  # Google OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 23955059535-ms7k1vo9hcgjdfhkoup7u3i01pqecq4u.apps.googleusercontent.com
            client-secret: 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
            scope: openid,profile,email
            redirect-uri: ${BACKEND_URL}/login/oauth2/code/google
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
            token-uri: https://oauth2.googleapis.com/token
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

# Logging
logging:
  level:
    org:
      springframework:
        security:
          oauth2: TRACE
        web: DEBUG  
        boot: 
          autoconfigure: ERROR  # Nâng lên ERROR để tắt log chi tiết auto-config
    com:
      pms:
        backend: DEBUG

#endpoint Prometheus
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
      base-path: /actuator  # Đảm bảo base-path đúng
    prometheus:
      enabled: true
      
  metrics:
    export:
      prometheus:
        enabled: true

frontend:
  url: ${FRONTEND_URL}
file:
  upload-dir: D:/PMS/uploads/documents/